# cargo-deny configuration for Ranger.
#
# Enforces the "privacy first / 100% offline" promise and sets a
# license/yanked policy compatible with a GPL-3.0-or-later project.
#
# Local run:
#     cargo install --locked cargo-deny
#     cargo deny check
#
# This configuration is deliberately strict on bans (deny anything that
# speaks TCP/HTTP) and permissive on "advisories.unmaintained" (warn):
# our dependency tree is dominated by Slint and its transitives; a warning
# doesn't break CI but stays visible.

[graph]
all-features = false
no-default-features = false
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # `paste` unmaintained (RUSTSEC-2024-0436). Pulled in ONLY by Slint's BUILD
    # chain (image → ravif → rav1e → paste, via i-slint-compiler), not by our
    # application code. "Unmaintained" advisory (not a vulnerability); nothing
    # to fix until Slint migrates away from it → explicitly ignored.
    "RUSTSEC-2024-0436",
    # `ttf-parser` unmaintained (RUSTSEC-2026-0192). TRANSITIVE dependency of
    # Slint's text rendering (resvg/fontdb), not our own code. "Unmaintained"
    # advisory (not a vulnerability), no safe upgrade available → ignored.
    "RUSTSEC-2026-0192",
    # `rustybuzz` unmaintained (RUSTSEC-2026-0206). Same situation as
    # `ttf-parser`: Slint's text shaping, transitive, no upgrade available.
    "RUSTSEC-2026-0206",
    # `quick-xml` 0.39 (RUSTSEC-2026-0194 / -0195): two DoS issues parsing
    # untrusted XML. NOT APPLICABLE here — quick-xml is only reached via
    # `wayland-scanner`, a proc-macro that reads the Wayland protocol files
    # shipped with the crate **at compile time**. No user file ever reaches
    # this parser at runtime. Upgrade impossible without a major winit/Slint
    # bump (version locked by the parent) → ignored, revisit once Slint
    # migrates.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "0BSD",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-only",        # Slint (open-source) : « GPL-3.0-only OR LicenseRef-Slint-* »
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal PATH dependencies (ranger-core ← ranger-gui) show up as
# "wildcard" (no version): false positive → allowed for path deps.
allow-wildcard-paths = true
highlight = "all"
allow = []

# Anything that talks to the network: forbidden. If Slint or a transitive
# dependency tries to pull in openssl-sys, hyper, reqwest, etc., CI must fail.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "rustls-pemfile" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-rustls" },
    { name = "hyper-tls" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "surf" },
    { name = "curl" },
    { name = "curl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
